[package]
name = "orbok"
description = "orbok application binary: backend bootstrap and GUI launch"
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
categories.workspace    = true
keywords.workspace      = true
repository.workspace    = true

[[bin]]
name = "orbok"
path = "src/main.rs"

[dependencies]
orbok-embed                 = { workspace = true }
orbok-core                  = { workspace = true }
orbok-db                    = { workspace = true }
orbok-fs                    = { workspace = true }
orbok-cache                 = { workspace = true }
orbok-models                = { workspace = true }
orbok-search                = { workspace = true }
orbok-extract               = { workspace = true }
orbok-workers               = { workspace = true }
orbok-ui                    = { workspace = true }
localcache                  = { workspace = true }

iced                        = { workspace = true }
rfd                         = { workspace = true }
app-json-settings           = { workspace = true }
starship-battery            = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
tokio                       = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true }

dirs                        = { workspace = true }
futures                     = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `Win32_UI_Shell` + `Win32_UI_WindowsAndMessaging`: `ShellExecuteW` and
# `SW_SHOWNORMAL` for opening a search result (Review 230 §3).
# `Win32_System_Console`: attaching to the parent console for command-line
# output; `Win32_Storage_Packaging_Appx`: `GetCurrentPackageFullName` to
# detect the Store package (Task 061).
windows-sys                 = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Task 132 review: probing the FileChooser portal before opening it.
zbus                        = { workspace = true }

[dev-dependencies]
tempfile                    = { workspace = true }
lopdf                       = { workspace = true }
rusqlite                    = { workspace = true }
# RFC-060 §11 criterion 2's DOCX fixture: a DOCX is a ZIP, and the test
# builds a minimal one rather than checking a binary into the tree.
zip                         = { workspace = true }
# Task 132 review §3.1's "slow user" test: `tokio::test(start_paused =
# true)` advances virtual time through a real 30s sleep instantly, instead
# of the test actually taking 30 real seconds.
tokio                       = { workspace = true, features = ["test-util"] }
