[advisories]
ignore = [
    # bincode 2.0.1 is pulled through localcache (0.21.1 as of RFC-053
    # Slice 2; still bincode 2.0.1 after that move). The advisory is
    # unmaintained status rather than a known vulnerability; nothing in
    # orbok or localcache's current line depends on a fixed release
    # existing yet.
    "RUSTSEC-2025-0141",

    # paste 1.0.15 is pulled transitively by GUI/model-support crates
    # (notably wgpu/metal and tokenizers macro helpers). The advisory is
    # unmaintained status for a proc-macro helper with no direct orbok usage.
    "RUSTSEC-2024-0436",

    # proc-macro-error2 2.0.1 is retained in Cargo.lock through defmt-macros
    # but is not present in the active all-target dependency tree. cargo audit
    # scans the lockfile, so keep this explicit until the lockfile no longer
    # carries that stale proc-macro branch.
    "RUSTSEC-2026-0173",

    # ttf-parser 0.25.1 is pulled by the GUI/font and PDF stacks
    # (fontdb/cosmic-text/usvg/lopdf). The advisory is unmaintained status;
    # replacement requires upstream GUI/PDF dependency movement.
    "RUSTSEC-2026-0192",

    # ── lru 0.16.4 — "use-after-free due to lack of panic safety in
    #    LruCache::pop()" (unsound, published 2026-05-12). Added 2026-08-12.
    #
    # Chain: lru <- cryoglyph <- iced_wgpu <- iced_renderer <- iced.
    # cryoglyph is iced's own glyph-cache crate. orbok depends on iced
    # directly (crates/app, crates/ui), so this is NOT introduced by snora or
    # lucide-icons -- they appear in `cargo tree -i` only as fellow consumers
    # of iced.
    #
    # Not reachable from orbok, for two independent reasons, both verified
    # against the pinned sources rather than assumed:
    #
    #   1. The advisory's trigger is a panic inside the *key type's* `Drop`
    #      while the node is freed but not yet detached. cryoglyph's cache is
    #      `LruCache<CacheKey, GlyphDetails, Hasher>`, and cosmic-text's
    #      `CacheKey` is `#[derive(Clone, Copy, ...)]`. A `Copy` type cannot
    #      implement `Drop` -- the compiler forbids it -- so the key's
    #      `drop_in_place` is a no-op that cannot panic.
    #   2. cryoglyph never calls the affected function. It calls `pop_lru()`
    #      (text_atlas.rs:91,101), which takes a different path with no
    #      `drop_in_place` of the key at all.
    #
    # Cannot be resolved locally: patched is >= 0.18.2, cryoglyph requires
    # `lru = "0.16"`, and `cargo update -p lru` moves nothing. The fix must
    # come from iced. Reported upstream --
    # .git-exclude/upstream-requests/iced-report-lru-rustsec-2026-0253-2026-08-12.md
    # -- including the verification that cryoglyph 0.1.0 compiles unmodified
    # against lru 0.18.2 with only its version requirement changed.
    #
    # REMOVE WHEN: iced ships a cryoglyph requiring lru >= 0.18.2. Re-check on
    # any iced upgrade; this entry must not outlive that release.
    "RUSTSEC-2026-0253",

    # ── zbus_names, zvariant, zvariant_derive -- "unmaintained" (RustSec,
    #    published 2026-10-16), Task 134. zbus's own D-Bus variant/name-
    #    encoding helpers, pulled in by zbus 5.16 (Task 132's portal probe)
    #    and by ashpd 0.11.1 (rfd's own XDG portal backend on Linux)
    #    through the same zbus 5.x line. Not a known vulnerability -- a
    #    maintenance-status warning for a proc-macro/encoding helper orbok
    #    calls only to probe for a FileChooser portal backend and read one
    #    D-Bus property (Task 132 review §2), never to parse untrusted
    #    D-Bus input from outside the local session bus.
    #
    #    zbus 6.0.0 has in fact dropped all three, replaced internally by a
    #    new zbus_utils crate with no zvariant/zbus_names dependency at
    #    all -- but ashpd, even its own latest release (0.13.13), still
    #    requires `zbus = "^5.13"` (checked against crates.io's own
    #    dependency API, not assumed), so orbok's own zbus cannot move to
    #    6.x without a version conflict against ashpd's pin.
    #
    # REMOVE WHEN: ashpd (or whichever portal crate orbok then depends on
    # for Task 132's probe) itself moves to zbus >= 6.0.0 -- check on every
    # ashpd/rfd upgrade, not just this one.
    "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372",
]
