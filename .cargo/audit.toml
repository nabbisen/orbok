[advisories]
ignore = [
    # bincode 2.0.1 is pulled through localcache (0.21.1 as of RFC-053
    # Slice 2; still bincode 2.0.1 after that move). The advisory is
    # unmaintained status rather than a known vulnerability; nothing in
    # orbok or localcache's current line depends on a fixed release
    # existing yet.
    "RUSTSEC-2025-0141",

    # paste 1.0.15 is pulled transitively by GUI/model-support crates
    # (notably wgpu/metal and tokenizers macro helpers). The advisory is
    # unmaintained status for a proc-macro helper with no direct orbok usage.
    "RUSTSEC-2024-0436",

    # proc-macro-error2 2.0.1 is retained in Cargo.lock through defmt-macros
    # but is not present in the active all-target dependency tree. cargo audit
    # scans the lockfile, so keep this explicit until the lockfile no longer
    # carries that stale proc-macro branch.
    "RUSTSEC-2026-0173",

    # ttf-parser 0.25.1 is pulled by the GUI/font and PDF stacks
    # (fontdb/cosmic-text/usvg/lopdf). The advisory is unmaintained status;
    # replacement requires upstream GUI/PDF dependency movement.
    "RUSTSEC-2026-0192",

    # ── lru 0.16.4 — "use-after-free due to lack of panic safety in
    #    LruCache::pop()" (unsound, published 2026-05-12). Added 2026-08-12.
    #
    # Chain: lru <- cryoglyph <- iced_wgpu <- iced_renderer <- iced.
    # cryoglyph is iced's own glyph-cache crate. orbok depends on iced
    # directly (crates/app, crates/ui), so this is NOT introduced by snora or
    # lucide-icons -- they appear in `cargo tree -i` only as fellow consumers
    # of iced.
    #
    # Not reachable from orbok, for two independent reasons, both verified
    # against the pinned sources rather than assumed:
    #
    #   1. The advisory's trigger is a panic inside the *key type's* `Drop`
    #      while the node is freed but not yet detached. cryoglyph's cache is
    #      `LruCache<CacheKey, GlyphDetails, Hasher>`, and cosmic-text's
    #      `CacheKey` is `#[derive(Clone, Copy, ...)]`. A `Copy` type cannot
    #      implement `Drop` -- the compiler forbids it -- so the key's
    #      `drop_in_place` is a no-op that cannot panic.
    #   2. cryoglyph never calls the affected function. It calls `pop_lru()`
    #      (text_atlas.rs:91,101), which takes a different path with no
    #      `drop_in_place` of the key at all.
    #
    # Cannot be resolved locally: patched is >= 0.18.2, cryoglyph requires
    # `lru = "0.16"`, and `cargo update -p lru` moves nothing. The fix must
    # come from iced. Reported upstream --
    # .git-exclude/upstream-requests/iced-report-lru-rustsec-2026-0253-2026-08-12.md
    # -- including the verification that cryoglyph 0.1.0 compiles unmodified
    # against lru 0.18.2 with only its version requirement changed.
    #
    # REMOVE WHEN: iced ships a cryoglyph requiring lru >= 0.18.2. Re-check on
    # any iced upgrade; this entry must not outlive that release.
    "RUSTSEC-2026-0253",

    # ── zbus_names, zvariant, zvariant_derive -- "unmaintained" (RustSec,
    #    published 2026-10-16), Task 134, corrected Task 138. zbus's own
    #    D-Bus variant/name-encoding helpers, pulled in by zbus 5.16 through
    #    **two independent paths**, confirmed with `cargo tree -i zbus@5`:
    #
    #    1. ashpd 0.11.1 (rfd's own XDG portal backend on Linux), used only
    #       to probe for a FileChooser portal backend and read one D-Bus
    #       property (Task 132 review §2), never to parse untrusted D-Bus
    #       input from outside the local session bus;
    #    2. iced's own default `linux-theme-detection` feature
    #       (`iced_winit` → `mundy` → `zbus` 5), which reads the desktop's
    #       light/dark preference over D-Bus (Task 138) -- snora's own
    #       letter about this release names the same two IDs and accepts
    #       the same three advisories for the same reason:
    #       `.git-exclude/upstream/snora/receive/0.53.0/snora-0.53.0-guarantee-correction-and-advisories-2026-10-20.md`.
    #
    #    Not a known vulnerability -- a maintenance-status warning for a
    #    proc-macro/encoding helper, on both paths.
    #
    #    zbus 6.0.0 has in fact dropped all three, replaced internally by a
    #    new zbus_utils crate with no zvariant/zbus_names dependency at
    #    all -- but ashpd, even its own latest release (0.13.13), still
    #    requires `zbus = "^5.13"` (checked against crates.io's own
    #    dependency API, not assumed), so orbok's own zbus cannot move to
    #    6.x without a version conflict against ashpd's pin. mundy has no
    #    comparable published release against zbus 6 yet either.
    #
    # REMOVE WHEN: **both** paths have moved to zbus >= 6.0.0 -- ashpd (or
    # whichever portal crate orbok then depends on for Task 132's probe)
    # *and* mundy (or whichever crate `iced_winit`'s `linux-theme-detection`
    # then depends on for Task 138's OS theme detection). Naming only the
    # first would leave this entry true of neither path once one moves
    # without the other -- check both on every ashpd/rfd/iced upgrade, not
    # just one of them.
    "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372",

    # ── zstd / zstd-safe — thirteen advisories published 2026-10-16
    #    (four "vulnerability", nine "unsound"), all in the same batch
    #    (zstd-rs PR #384). Pulled by `localcache` 0.21.4 (`zstd::encode_all`/
    #    `zstd::decode_all`, `src/serialization.rs` -- confirmed by reading
    #    that source, not assumed), the only two zstd calls anywhere in
    #    localcache's own tree (`grep -rn "zstd::" src/`).
    #
    #    Each advisory's own affected-function list names a narrower API
    #    `encode_all`/`decode_all` never reaches, checked individually
    #    against localcache 0.21.4's actual two call sites, both the
    #    simplest one-shot form (a fresh context per call, used once, never
    #    reused, never mixed with streaming, no custom parameters, no
    #    dictionary, no `seekable` feature):
    #
    #      - RUSTSEC-2026-0391: `Encoder::with_context`/`Decoder::with_context`
    #        -- the raw, explicitly-context-reusing stream API; `encode_all`/
    #        `decode_all` construct a fresh `Encoder`/`Decoder` via `::new`,
    #        never `with_context`.
    #      - RUSTSEC-2026-0396, -0398, -0405: `Seekable`/`AdvancedSeekable`/
    #        `SeekableCStream` -- the `seekable` feature's own API, unused.
    #      - RUSTSEC-2026-0403: `DCtx::decompress_stream` -- the advisory's
    #        own text states plainly: "`zstd::stream::read::Decoder`,
    #        `zstd::decode_all` and the bulk API are not affected."
    #      - RUSTSEC-2026-0395: `CCtx::set_parameter` -- no custom parameter
    #        is ever set.
    #      - RUSTSEC-2026-0397: `OutBuffer::around_pos` -- manual
    #        buffer-position streaming, not `io::copy` through `Read`/`Write`
    #        (what `copy_encode`/`copy_decode` actually use).
    #      - RUSTSEC-2026-0399, -0400: one-shot calls
    #        (`init_using_cdict`/`init_using_ddict`,
    #        `decompress`/`decompress_using_dict`/`_ddict`) left open against
    #        a *later, reused* streaming call on the same context -- there is
    #        no later call; each context is used exactly once, then dropped.
    #      - RUSTSEC-2026-0401: `train_from_buffer` -- no dictionary
    #        training anywhere in localcache.
    #      - RUSTSEC-2026-0402, -0404: `CCtx`/`DCtx::try_clone` -- never
    #        called.
    #      - RUSTSEC-2026-0406: `CCtx::load_dictionary`/`ref_cdict` -- no
    #        dictionary.
    #
    #    Cannot be resolved locally: the patched `zstd-safe` line is
    #    `>= 8.2.0`, which needs `zstd >= 0.14.3` (confirmed against
    #    crates.io's own dependency API: `zstd` 0.14.3 requires
    #    `zstd-safe = "^8.2.0"`) -- but localcache 0.21.4, the latest
    #    published release, still pins `zstd = "0.13"`
    #    (`[dependencies.zstd] version = "0.13"` in its own Cargo.toml), so
    #    `cargo update -p zstd` moves nothing within that constraint. The
    #    fix must come from localcache.
    #
    # REMOVE WHEN: localcache publishes a release requiring `zstd >= 0.14.3`.
    # Re-check on every localcache upgrade; this entry must not outlive that
    # release.
    "RUSTSEC-2026-0391", "RUSTSEC-2026-0395", "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397", "RUSTSEC-2026-0398", "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400", "RUSTSEC-2026-0401", "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403", "RUSTSEC-2026-0404", "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
]
