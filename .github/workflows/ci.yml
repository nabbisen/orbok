# orbok CI: fast gate + release gate (RFC-019 §7)
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Fast gate: runs on every PR (< 5 min target) ──────────────────
  # Measured at 4 min 33 s as of eb9b3d5 (Review 144 §3) -- ~27 s of
  # headroom left. The RFC-052 §6 additions (design-token/i18n-literal
  # checkers, the scoped `tests::i18n` step) cost ~+1 min 52 s versus the
  # immediately preceding run. The two shell checkers are near-free
  # (pure grep over source text); the cost is compiling orbok-ui for the
  # exhaustive catalog test, which is paid whether that step runs one test
  # or its whole suite. If this budget is ever breached, extracting `i18n`
  # into a crate without the iced/wgpu/snora dependency tree would remove
  # that cost -- a real refactor, not recommended pre-emptively, recorded
  # here so the option is known rather than rediscovered under pressure.
  fast:
    name: Fast gate (fmt + clippy + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Task 039: pinned, not @stable -- an unpinned resolution can turn an
      # unchanged commit red the day a new stable release ships (Review 192
      # §2), and RFC-053 already measured this workspace's actual MSRV risk
      # as low, so there is little to trade away by making this job
      # reproducible. See the `release` job below for the one gate that
      # stays @stable and why. Bump at release prep
      # (docs/src/maintainers/release_readiness.md's packaging checklist).
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --exclude orbok --exclude orbok-ui --exclude orbok-bench -- -D warnings

      - name: design-token gate (RFC-032/052 §5)
        run: bash scripts/check-design-tokens.sh

      - name: i18n literal-copy gate (RFC-052 §6)
        run: bash scripts/check-i18n-literals.sh

      - name: unit tests (no GUI crates)
        env:
          ORBOK_DATA_DIR: /tmp/orbok-ci
        run: |
          cargo test --workspace \
            --exclude orbok \
            --exclude orbok-ui \
            --exclude orbok-bench \
            -- --test-threads=4

      # RFC-052 §6/HANDOFF-052 §4 item 1: exhaustive (Locale, MessageKey)
      # catalog tests must run in both fast and release CI. orbok-ui is
      # otherwise excluded above for build-time reasons (it pulls in the
      # full iced/wgpu/snora GUI dependency tree), so this is scoped to the
      # i18n test module only rather than orbok-ui's full suite (which
      # already runs in the release gate below).
      - name: exhaustive i18n catalog tests
        run: cargo test -p orbok-ui --lib tests::i18n

  # ── Release gate: runs on main and release branches ──────────────
  release:
    name: Release gate (full build + check + bench smoke)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: fast
    steps:
      - uses: actions/checkout@v4
      # Task 039: the one gate job left on @stable, deliberately. Its own
      # "strict clippy" step below is the only lint pass across the *whole*
      # workspace with --all-targets -- the entire value of an @stable job
      # is surfacing a new lint the day it ships, and only a full-workspace
      # lint does that. `fast`'s clippy excludes orbok/orbok-ui/orbok-bench;
      # `security` and `cross` run no clippy at all -- neither would satisfy
      # the purpose, only the letter.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: feature matrix (tract)
        run: cargo check -p orbok-embed --features tract

      - name: strict clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: workspace library tests
        run: cargo test --workspace --lib

      - name: version and lockfile coherence
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: RFC lifecycle integrity self-test
        run: bash scripts/check-rfc-lifecycle.test.sh

      - name: RFC lifecycle integrity
        run: bash scripts/check-rfc-lifecycle.sh

      # RFC-052 §6/HANDOFF-052 §4 item 1. Exhaustive (Locale, MessageKey)
      # catalog tests are already covered by "workspace library tests"
      # above (--workspace --lib includes orbok-ui, unlike the fast gate).
      - name: design-token gate self-test (RFC-032/052 §5)
        run: bash scripts/check-design-tokens.test.sh

      - name: design-token gate (RFC-032/052 §5)
        run: bash scripts/check-design-tokens.sh

      - name: i18n literal-copy gate self-test (RFC-052 §6)
        run: bash scripts/check-i18n-literals.test.sh

      - name: i18n literal-copy gate (RFC-052 §6)
        run: bash scripts/check-i18n-literals.sh

      - name: build --release
        run: cargo build --release --package orbok

      - name: --version
        run: ./target/release/orbok --version

      - name: --check headless
        env:
          ORBOK_DATA_DIR: /tmp/orbok-release-check
        run: |
          rm -rf "$ORBOK_DATA_DIR"
          # RFC-054 §9.6: with an ORBOK_DATA_DIR override active, the
          # runner's real platform config directory must be untouched --
          # not merely unused for the resolved path (RFC-054 §4.5).
          # Snapshots $HOME for any orbok-named entry before and after,
          # rather than duplicating dirs'/app-json-settings' own per-OS
          # config-path resolution in a second, driftable implementation,
          # and rather than setting HOME/APPDATA to fake a location --
          # HANDOFF-054's Slice 2 section explicitly rules out both.
          #
          # Review 149 §5.1: the snapshot includes each entry's mtime
          # (`-printf '%p %T@\n'`), not just its path. A path-only snapshot
          # cannot detect an existing file being rewritten in place (e.g. if
          # ~/.config/orbok/ already existed and --check overwrote
          # settings.json inside it, "created or modified" would be a false
          # claim -- the path list would be identical before and after).
          # Runner ephemerality happened to make that gap unobservable
          # today; the mtime column makes the check true regardless of
          # runner state rather than relying on it.
          before="$(find "$HOME" -maxdepth 4 -iname '*orbok*' -printf '%p %T@\n' 2>/dev/null | sort)"
          ./target/release/orbok --check
          after="$(find "$HOME" -maxdepth 4 -iname '*orbok*' -printf '%p %T@\n' 2>/dev/null | sort)"
          if [ "$before" != "$after" ]; then
            echo "error: orbok --check with an ORBOK_DATA_DIR override created or modified something under \$HOME -- RFC-054 §4.5 requires the platform config directory be untouched, not merely unused" >&2
            echo "before:" >&2
            echo "$before" >&2
            echo "after:" >&2
            echo "$after" >&2
            exit 1
          fi

      - name: benchmark smoke (10 docs)
        env:
          ORBOK_DATA_DIR: /tmp/orbok-bench
        run: cargo test -p orbok-workers benchmark_corpus -- --nocapture

      - name: release packaging self-test (RFC-051 adversarial suite)
        run: bash scripts/package.test.sh

      - name: release archive checks
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test -n "$version"

          # Two clean builds of the same commit must be byte-identical
          # (RFC-051 §5/§6) -- not merely asserted by the fixture suite
          # above, demonstrated here against the real release commit.
          ./scripts/package.sh "$version"
          hash1="$(sha256sum "dist/orbok-${version}.tar.gz" | awk '{print $1}')"
          mv "dist/orbok-${version}.tar.gz" "dist/orbok-${version}.tar.gz.build1"
          mv "dist/orbok-${version}.tar.gz.sha256" "dist/orbok-${version}.tar.gz.sha256.build1"
          ./scripts/package.sh "$version"
          hash2="$(sha256sum "dist/orbok-${version}.tar.gz" | awk '{print $1}')"
          if [ "$hash1" != "$hash2" ]; then
            echo "release archive is not reproducible: $hash1 != $hash2" >&2
            exit 1
          fi
          rm -f "dist/orbok-${version}.tar.gz.build1" "dist/orbok-${version}.tar.gz.sha256.build1"

          # Independent verification (RFC-051 §6): derives the expected set
          # from `git ls-tree` plus the shared policy, never from this
          # step's own producer output above.
          ./scripts/verify-release-archive.sh "dist/orbok-${version}.tar.gz"

  # ── Security gate: mandatory on every PR ─────────────────────────
  security:
    name: Security gate (audit + security tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Task 039: pinned -- see the `fast` job's comment above for the
      # reasoning; this job runs no clippy at all, so it was never a
      # candidate for the one job that stays @stable.
      - uses: dtolnay/rust-toolchain@1.98.1

      # Task 036 §2b (audit E-06): was unpinned (resolves whatever version
      # is latest on the day CI runs) and masked its own install failure
      # with `|| true` -- a gate that can silently stop running without
      # turning anything red. Pinned, and a genuine install failure is now
      # red like everything else here.
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --quiet

      - name: audit dependencies
        run: cargo audit --deny warnings

      - name: security unit tests
        run: cargo test -p orbok-workers security -- --test-threads=1

  # ── MSRV gate (RFC-053, Task 036) ──────────────────────────────────
  # RFC-053's stated purpose is "a measured, not declared, MSRV" --
  # Cargo.toml's `rust-version = "1.91"` had never actually been built
  # against until this job existed. Pinned, not `@stable`: the question
  # this answers is "does the declared floor still build", which must not
  # itself drift with whatever the latest compiler happens to be on a
  # given day (Review 192 §2 -- the same class of problem, from the other
  # direction: an unpinned `@stable` job turning an unchanged commit red).
  # `check`, not `test` -- the point is compiling on the floor, and a full
  # test run doubles this job's time for no additional signal.
  #
  # Task 039 pinned the rest of the gate jobs for the same reason this one
  # already was: `fast`, `security`, and `cross` now use
  # `dtolnay/rust-toolchain@1.98.1`, not `@stable`. `release` is the one
  # deliberate exception -- see its own comment above.
  msrv:
    name: MSRV gate (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - run: cargo check --workspace --locked --all-targets

  # ── Cross-platform smoke (RFC-019 §9) ────────────────────────────
  cross:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false lets every OS leg run to completion independently.
      # This is a platform CONFORMANCE matrix (RFC-019 §7): a failure on one
      # platform must not cancel the other two before they report their own
      # results -- each leg's outcome is itself evidence, not just a gate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Task 039: pinned -- see the `fast` job's comment for the reasoning.
      # `dtolnay/rust-toolchain` resolves the same pinned version on all
      # three platforms in this matrix, not just ubuntu.
      - uses: dtolnay/rust-toolchain@1.98.1

      - name: build core crates
        run: cargo build -p orbok-core -p orbok-db -p orbok-fs -p orbok-workers

      # RFC-049 Slice 2 (Correction Request 111 §4 C2/C3): the runtime
      # isolation boundary and its OS-level denial harness (chmod 000 on
      # Unix, an icacls deny ACE on Windows) are platform-specific and must
      # run natively per platform, not just cross-compile-checked. This is
      # also the app binary's (`orbok`, `--bin orbok`) only test coverage in
      # CI today: `fast` excludes it and `release` runs `--lib` only, neither
      # of which reaches `main.rs`'s own test module. Placed early in this
      # job (Review 113 F3): if a later step in this leg fails, this step
      # must not be starved of a chance to run by it.
      - name: RFC-049 runtime isolation and boundary tests
        run: cargo test -p orbok --bin orbok --locked

      # Review 149 §2: `--bin orbok` above and `--lib` are disjoint test
      # sets (`cargo test -p orbok --bin orbok -- --list` contains zero
      # `runtime_context` tests; `--lib` contains all of them), and until
      # this step, nothing ran `orbok`'s `--lib` target anywhere in this
      # matrix -- `fast`/`security`/`release` all run it, but all three are
      # ubuntu-only. That silently limited RFC-054 §9.1's access-seam test
      # (`standard_override_never_authorizes_a_path_under_the_platform_config_dir`)
      # to Linux, the exact "green because nothing on macOS/Windows was
      # asked the question" shape RFC-054 §2.6 was written about. This also
      # brings the other 13 `runtime_context` tests (RFC-049's own) onto
      # macOS and Windows for the first time.
      - name: orbok library tests (runtime_context, cross-platform)
        run: cargo test -p orbok --lib --locked

      # Task 032: orbok-cache joins this step (was previously untested off
      # Linux) rather than getting its own -- same shape as orbok-core/db/fs,
      # a small foundational crate with no GUI/bin surface of its own.
      - name: test core crates
        env:
          ORBOK_DATA_DIR: /tmp/orbok-cross
        run: cargo test -p orbok-core -p orbok-db -p orbok-fs -p orbok-cache

      # Task 032 (RFC-019 §7): document extraction was the most likely of the
      # 289-test gap to hide a real platform difference -- encodings, line
      # endings, PDF backend behaviour -- and the least likely to be caught
      # any other way. lopdf/zip are pure Rust, no system library dependency,
      # so nothing here was structurally excluded.
      - name: orbok-extract tests (cross-platform)
        run: cargo test -p orbok-extract --lib --locked

      # Task 032: model file I/O, path resolution, tokenizer loading -- the
      # part of path handling `orbok --lib`'s runtime_context suite (above)
      # does not already cover.
      - name: orbok-models tests (cross-platform)
        run: cargo test -p orbok-models --lib --locked

      # Task 032: SQLite FTS5 with unicode61, previously untested off Linux
      # for no structural reason -- rusqlite's `bundled` feature compiles its
      # own SQLite, so nothing here depends on a system library. Running this
      # here retires B2.1/B2.2 from the Windows manual pass permanently
      # (`.git-exclude/evidence/owner-task-003-partb/`, §B).
      - name: orbok-search tests (cross-platform)
        run: cargo test -p orbok-search --lib --locked

      # Task 032: default-features only. The `tract` feature (~150 MB extra
      # compile) is already build-checked -- not test-run -- ubuntu-only in
      # the release gate's "feature matrix (tract)" step above; running its
      # tests on all three legs here was judged out of proportion to what
      # this task asked for and is deliberately not done, not silently
      # skipped.
      - name: orbok-embed tests (cross-platform, default features)
        run: cargo test -p orbok-embed --lib --locked

      # Task 032 (RFC-019 §7): supersedes the two narrower filters this
      # replaced (`model_lifecycle`, `abrupt_process_exit_at_each_
      # durability_boundary_recovers_coherently`), which existed here first
      # because durability was judged the highest-value subset to check
      # early -- not because the rest of the crate's 172 tests were
      # deliberately excluded. They were simply never added. This single run
      # now covers all of them, including the scheduler logic
      # (`rfc036_scheduler`) and the filesystem-touching pipeline tests that
      # had never executed off Linux.
      - name: orbok-workers tests (cross-platform)
        run: cargo test -p orbok-workers --lib --locked

      # RFC-019 §7's platform matrix (Task 014): Release Smoke's minimum is
      # "Yes" for Windows and macOS, not just Linux, but the `release` job
      # below is `runs-on: ubuntu-latest` only -- the `orbok` binary has
      # never been built, versioned, or self-checked on either platform.
      # Cheapest correct shape: run the platform-relevant core (build
      # --release, --version, --check headless) here on all three legs,
      # rather than duplicating the whole `release` job's packaging/archive/
      # benchmark-smoke steps, which are not platform-matrix concerns and
      # stay ubuntu-only. Deliberately narrower than `release`'s own
      # `--check headless` step: that step additionally asserts (RFC-054
      # §9.6) that the real platform config directory is untouched, via a
      # `find -printf`-based `$HOME` snapshot -- a GNU coreutils extension
      # BSD `find` (macOS) does not support. Replicating that exact script
      # here would risk a false "macOS failure" that is a non-portable CI
      # script bug, not the product defect this task exists to surface, so
      # this step verifies only that `--check` itself exits successfully on
      # each platform; the deeper $HOME-isolation assertion remains
      # ubuntu-only in `release` below.
      - name: build --release
        run: cargo build --release --package orbok

      - name: --version
        shell: bash
        run: |
          bin="target/release/orbok"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="target/release/orbok.exe"; fi
          "$bin" --version

      - name: --check headless
        shell: bash
        env:
          ORBOK_DATA_DIR: ${{ runner.temp }}/orbok-cross-check
        run: |
          bin="target/release/orbok"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="target/release/orbok.exe"; fi
          rm -rf "$ORBOK_DATA_DIR"
          "$bin" --check

      # RFC-019 §7 / Task 014 §2: `orbok-ui`'s 94 tests (including
      # `iced_test::Simulator`'s headless view-rendering suite) have only
      # ever run on Linux -- `fast` excludes `orbok-ui` for build-time
      # reasons, `cross` never mentioned it, and `release`'s `--workspace
      # --lib` reaches it but that job is ubuntu-only. `iced_test::Simulator`
      # is headless by design, so there is no technical reason this cannot
      # run on all three legs.
      - name: orbok-ui library tests (cross-platform)
        run: cargo test -p orbok-ui --lib --locked
