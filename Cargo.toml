[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/data/db",
    "crates/data/fs",
    "crates/data/cache",
    "crates/pipeline/extract",
    "crates/search/engine",
    "crates/search/models",
    "crates/pipeline/workers",
    "crates/bench",
    "crates/search/embed",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.24.0"
edition                 = "2024"
rust-version            = "1.91"
license                 = "Apache-2.0"
authors                 = ["nabbisen"]
categories              = ["gui", "development-tools", "text-processing", "visualization"]
keywords                = ["gui", "search", "text", "pdf", "excel"]
repository              = "https://github.com/nabbisen/orbok"

[workspace.dependencies]
# internal crates
orbok-core                  = { version = "0", path = "crates/core" }
orbok-db                    = { version = "0", path = "crates/data/db" }
orbok-fs                    = { version = "0", path = "crates/data/fs" }
orbok-cache                 = { version = "0", path = "crates/data/cache" }
orbok-extract               = { version = "0", path = "crates/pipeline/extract" }
orbok-search                = { version = "0", path = "crates/search/engine" }
orbok-models                = { version = "0", path = "crates/search/models" }
orbok-workers               = { version = "0", path = "crates/pipeline/workers" }
orbok-bench                 = { version = "0", path = "crates/bench" }
orbok-embed                 = { version = "0", path = "crates/search/embed" }
orbok-ui                    = { version = "0", path = "crates/ui" }

# ai
tract-onnx                  = { version = "0.23" }
tract-core                  = { version = "0.23" }
tokenizers                  = { version = "0.23", default-features = false, features = ["fancy-regex"] }
prost                       = { version = "0.14" }

# database — pinned to 0.39 (RFC-053 supersedes DEC-006): rusqlite 0.40's
# libsqlite3-sys 0.38.x uses an undeclared, unmeasured Rust 1.95 MSRV floor
# (cfg_select! in its build script); 0.39 keeps orbok's measured floor lower.
# Track localcache's current requirement line rather than pinning a specific
# localcache release (single libsqlite3-sys rule; see RFC-002 §16).
rusqlite                    = { version = "0.39", features = ["bundled"] }

# cache engine — RFC-053 Slice 2: current line (0.21), tracking localcache's
# published line rather than a specific patch (mtime ns-precision fix and
# schema v5 from Appendix A are retained; single libsqlite3-sys rule, see
# RFC-002 §16).
localcache                  = { version = "0.21", features = ["compression", "tracing"] }

# GUI — RFC-027 decision: iced 0.14 via snora 0.18
iced                        = { version = "0.14", features = ["tokio"] }
snora                       = { version = "0.37", features = ["design"] }
rfd                         = "0.15"
# app-json-settings — RFC-055: the 2.7.0 floor is deliberate, not "latest
# 2.x". 2.0.3's ConfigManager::new() silently substitutes on two failures
# orbok must not tolerate: a missing platform config directory falls back
# to the working directory, and an undeterminable executable name falls
# back to the fixed literal "app", which any two such executables share
# and can silently overwrite. 2.6.0 adds for_app(), which orbok uses
# instead to fail rather than substitute either. A bare `version = "2"`
# let a routine `cargo update` adopt that fallback behavior with no code
# change and no review (RFC-055 §2.3) -- this floor is what makes "orbok
# requires the fail-closed constructor" a checked fact, not a habit.
# The 2.7.0 floor is for try_with_filename's validation, which from 2.7.0
# rejects Windows reserved device names (NUL, CON, ... including as a
# stem with an extension, so nul.json too). orbok passes a fixed literal
# ("settings.json") today, so nothing depends on it; the floor exists so
# the checked setter is meaningfully checked if that ever changes
# (Task 008).
app-json-settings           = { version = "2.7.0" }

# battery detection — RFC-057 §4.3d: starship-battery, the actively
# maintained fork of the abandoned `battery` crate (same author moved
# maintenance there; used by the `starship` prompt). Checked 2026-08-13:
# 0.11.1, ISC licence, last published 2026-07-05, upstream repo pushed the
# same day this floor was set. Covers Linux/macOS/Windows plus the BSDs and
# iOS — matches this workspace's three-leg CI matrix exactly. Transitive
# deps are the expected per-platform OS bindings (windows-sys, objc2-*,
# libc, nix) plus uom/num-traits/cfg-if; nothing unexpected. `rust-version
# = "1.89"` is under this workspace's own 1.91 floor, so no toolchain
# conflict. Load-bearing beyond version/licence/platform: it filters to
# `Scope::System` batteries (`platform/linux/device.rs`), so a wireless
# mouse or other peripheral battery reporting through the same OS APIs is
# not mistaken for "the machine is on battery" -- confirmed against a real
# HID++ mouse battery during Review 179. A future swap that loses this
# filtering would be a silent regression on most desktop machines, not a
# theoretical one.
starship-battery             = "0.11.1"

# shared utilities
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
sha2                        = "0.11"
url                         = "2.5"
time                        = { version = "0.3", features = ["formatting", "macros"] }
thiserror                   = "2"
tokio                       = { version = "1.23", features = ["rt-multi-thread", "macros"] }
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter"] }
uuid                        = { version = "1", features = ["v7"] }

dirs                        = "6"
zip                         = { version = "2", default-features = false, features = ["deflate"] }
lopdf                       = "0.42"
futures                     = "0.3"
fs4                         = "1.1"
reqwest                     = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
windows-sys                 = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

# dev
tempfile                    = "3"
iced_test                   = "0.14"

[profile.release]
opt-level       = "z"
lto             = true
strip           = true
codegen-units   = 1
